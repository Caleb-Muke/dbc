<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - DBC Adhésions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #003DA5 0%, #001F5C 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 61, 165, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            color: #003DA5;
            font-size: 1.8rem;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: #003DA5;
            color: white;
        }

        .btn-primary:hover {
            background: #001F5C;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #228B22;
            color: white;
        }

        .btn-secondary:hover {
            background: #1a6b1a;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 61, 165, 0.1);
            border-left: 5px solid #FFD700;
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #003DA5;
        }

        .table-wrapper {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 61, 165, 0.2);
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #003DA5 0%, #001F5C 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background: #f5f5f5;
        }

        tbody tr:nth-child(even) {
            background: #fafafa;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-buttons button {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-message i {
            font-size: 3rem;
            color: #ddd;
            margin-bottom: 15px;
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            color: #003DA5;
            margin-bottom: 20px;
        }

        .detail-item {
            margin-bottom: 15px;
        }

        .detail-item strong {
            color: #003DA5;
            display: block;
            margin-bottom: 5px;
        }

        .detail-item span {
            color: #666;
        }

        .close-btn {
            background: #999;
            padding: 8px 15px;
            font-size: 0.9rem;
            width: 100%;
            margin-top: 20px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .search-box input:focus {
            outline: none;
            border-color: #003DA5;
            box-shadow: 0 0 10px rgba(0, 61, 165, 0.2);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            h1 {
                font-size: 1.3rem;
            }

            .header-actions {
                width: 100%;
                justify-content: center;
            }

            button {
                width: 100%;
            }

            table {
                font-size: 0.9rem;
            }

            th, td {
                padding: 10px 8px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1><i class="fas fa-user-check"></i> Gestion des Adhésions DBC</h1>
            </div>
            <div class="header-actions">
                <button class="btn-primary" onclick="exportToCSV()">
                    <i class="fas fa-download"></i> Exporter CSV
                </button>
                <button class="btn-secondary" onclick="refreshPage()">
                    <i class="fas fa-sync"></i> Actualiser
                </button>
                <button class="btn-danger" onclick="clearAllData()">
                    <i class="fas fa-trash"></i> Effacer Tout
                </button>
            </div>
        </header>

        <div class="success-message" id="successMessage"></div>

        <div class="stats" id="statsContainer"></div>

        <div class="table-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Rechercher par nom, email ou province...">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Province</th>
                        <th>Date d'adhésion</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
            <div id="emptyMessage" class="empty-message">
                <i class="fas fa-inbox"></i>
                <p>Aucune adhésion enregistrée pour le moment.</p>
            </div>
        </div>
    </div>

    <!-- Modal pour voir les détails -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <h2>Détails de l'Adhésion</h2>
            <div id="detailContent"></div>
            <button class="close-btn" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script>
        // Charger et afficher les adhésions
        function loadAdherents() {
            const adherents = JSON.parse(localStorage.getItem('adherents')) || [];
            const tableBody = document.getElementById('tableBody');
            const emptyMessage = document.getElementById('emptyMessage');
            
            if (adherents.length === 0) {
                tableBody.innerHTML = '';
                emptyMessage.style.display = 'block';
                updateStats(adherents);
                return;
            }

            emptyMessage.style.display = 'none';
            tableBody.innerHTML = '';

            adherents.forEach((adherent, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${adherent.nom}</td>
                    <td>${adherent.email}</td>
                    <td>${adherent.telephone}</td>
                    <td>${adherent.province}</td>
                    <td>${adherent.date}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-primary" onclick="viewDetails(${index})">
                                <i class="fas fa-eye"></i> Voir
                            </button>
                            <button class="btn-danger" onclick="deleteAdherent(${index})">
                                <i class="fas fa-trash"></i> Supprimer
                            </button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            updateStats(adherents);
        }

        // Mettre à jour les statistiques
        function updateStats(adherents) {
            const statsContainer = document.getElementById('statsContainer');
            
            const provinces = {};
            adherents.forEach(a => {
                provinces[a.province] = (provinces[a.province] || 0) + 1;
            });

            const topProvince = Object.entries(provinces).sort((a, b) => b[1] - a[1])[0];

            statsContainer.innerHTML = `
                <div class="stat-card">
                    <h3>Total Adhésions</h3>
                    <div class="number">${adherents.length}</div>
                </div>
                <div class="stat-card">
                    <h3>Province la Plus Active</h3>
                    <div class="number">${topProvince ? topProvince[0] : 'N/A'}</div>
                </div>
                <div class="stat-card">
                    <h3>Nombre de Provinces</h3>
                    <div class="number">${Object.keys(provinces).length}</div>
                </div>
            `;
        }

        // Voir les détails
        function viewDetails(index) {
            const adherents = JSON.parse(localStorage.getItem('adherents')) || [];
            const adherent = adherents[index];
            
            const detailContent = document.getElementById('detailContent');
            detailContent.innerHTML = `
                <div class="detail-item">
                    <strong>Nom Complet:</strong>
                    <span>${adherent.nom}</span>
                </div>
                <div class="detail-item">
                    <strong>Email:</strong>
                    <span>${adherent.email}</span>
                </div>
                <div class="detail-item">
                    <strong>Téléphone:</strong>
                    <span>${adherent.telephone}</span>
                </div>
                <div class="detail-item">
                    <strong>Profession:</strong>
                    <span>${adherent.profession || 'Non spécifiée'}</span>
                </div>
                <div class="detail-item">
                    <strong>Province:</strong>
                    <span>${adherent.province}</span>
                </div>
                <div class="detail-item">
                    <strong>Date d'adhésion:</strong>
                    <span>${adherent.date} à ${adherent.timestamp}</span>
                </div>
                <div class="detail-item">
                    <strong>Message:</strong>
                    <span>${adherent.message || 'Aucun message'}</span>
                </div>
            `;
            
            document.getElementById('detailModal').classList.add('show');
        }

        // Fermer le modal
        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        // Supprimer une adhésion
        function deleteAdherent(index) {
            if (confirm('Êtes-vous sûr de vouloir supprimer cette adhésion?')) {
                const adherents = JSON.parse(localStorage.getItem('adherents')) || [];
                const deleted = adherents.splice(index, 1);
                localStorage.setItem('adherents', JSON.stringify(adherents));
                
                showSuccess(`Adhésion de ${deleted[0].nom} supprimée.`);
                loadAdherents();
            }
        }

        // Exporter en CSV
        function exportToCSV() {
            const adherents = JSON.parse(localStorage.getItem('adherents')) || [];
            
            if (adherents.length === 0) {
                alert('Aucune adhésion à exporter.');
                return;
            }

            const headers = ['Nom', 'Email', 'Téléphone', 'Profession', 'Province', "Date d'adhésion", 'Heure', 'Message'];
            const rows = adherents.map(a => [
                a.nom,
                a.email,
                a.telephone,
                a.profession || '',
                a.province,
                a.date,
                a.timestamp,
                a.message || ''
            ]);

            let csv = headers.join(';') + '\n';
            rows.forEach(row => {
                csv += row.map(cell => `"${cell}"`).join(';') + '\n';
            });

            // Créer un fichier pour télécharger
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `adhésions_DBC_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);

            showSuccess('Export CSV réussi!');
        }

        // Recherche en temps réel
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('keyup', (e) => {
                const query = e.target.value.toLowerCase();
                const rows = document.querySelectorAll('#tableBody tr');
                
                rows.forEach(row => {
                    const text = row.textContent.toLowerCase();
                    row.style.display = text.includes(query) ? '' : 'none';
                });
            });
        }

        // Afficher un message de succès
        function showSuccess(message) {
            const successMessage = document.getElementById('successMessage');
            successMessage.textContent = message;
            successMessage.classList.add('show');
            
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }

        // Effacer toutes les données
        function clearAllData() {
            if (confirm('ATTENTION! Cela va supprimer TOUTES les adhésions. Êtes-vous absolument sûr?')) {
                if (confirm('Confirmez à nouveau: Vous êtes sûr de vouloir supprimer toutes les données?')) {
                    localStorage.removeItem('adherents');
                    showSuccess('Toutes les données ont été supprimées.');
                    loadAdherents();
                }
            }
        }

        // Rafraîchir la page
        function refreshPage() {
            location.reload();
        }

        // Fermer le modal en cliquant en dehors
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') {
                closeModal();
            }
        });

        // Charger au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            loadAdherents();
            setupSearch();
        });
    </script>
</body>
</html>
